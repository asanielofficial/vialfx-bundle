name: Build VialFX-Bundle

# Current scope: VST3 and CLAP on Linux, Windows and macOS; LV2 on all three; AU on macOS.
# Whole builds (all platforms, CLAP, LV2, host tests) run only when asked for, from the Actions tab. Pushes do
# not start them; use "Test build" for a quick portable Windows or Linux build of a change.
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]   # a version tag (v1.4) builds everything and publishes the release for it

permissions:
  contents: read

env:
  VERSION: "1.4"

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev libgl1-mesa-dev \
            libglu1-mesa-dev libcurl4-openssl-dev libgl1-mesa-dri liblilv-dev lv2-dev lilv-utils

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all plugins
        run: cmake --build build

      - name: Load every plugin in a test host
        run: |
          for p in build/plugins/*_artefacts/Release/VST3/*.vst3; do
            echo "=== $p"
            xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              build/vialfx_host_test_artefacts/Release/vialfx_host_test "$p"
          done

      - name: Pitch Shifter accuracy (measured pitch and formants per mode)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/PitchShifter_artefacts/Release/VST3/Vial Pitch Shifter.vst3" --pitch

      - name: Utility checks (gain, pan, polarity, swap, width, Haas, mono bass, DC)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/Utility_artefacts/Release/VST3/Vial Utility.vst3" --utility

      - name: Freq Shifter checks (shift, sideband, feedback)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/FreqShifter_artefacts/Release/VST3/Vial Freq Shifter.vst3" --shifter

      - name: Vibrato checks (depth, rate, A+B sum)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/Vibrato_artefacts/Release/VST3/Vial Vibrato.vst3" --vibrato

      - name: Tremolo checks (depth, rate, A+B sum)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/Tremolo_artefacts/Release/VST3/Vial Tremolo.vst3" --tremolo

      - name: Filter and distortion mode checks
        run: |
          for p in Filter Distortion; do
            xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              build/vialfx_host_test_artefacts/Release/vialfx_host_test \
              "build/plugins/${p}_artefacts/Release/VST3/Vial ${p}.vst3" --modes
          done

      - name: Morph checks (all modes, latency)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/Morph_artefacts/Release/VST3/Vial Morph.vst3" --morph

      - name: Resonator checks (pitch, MIDI note, MPE bend, polyphony)
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
            build/vialfx_host_test_artefacts/Release/vialfx_host_test \
            "build/plugins/Resonator_artefacts/Release/VST3/Vial Resonator.vst3" --resonator

      - name: LV2 checks (discovery, instantiate, process audio)
        run: |
          g++ -std=c++17 tests/lv2_host_test.cpp $(pkg-config --cflags --libs lilv-0) -o lv2_host_test
          export LV2_PATH=$(mktemp -d)
          cp -r build/plugins/*_artefacts/Release/LV2/*.lv2 "$LV2_PATH"/
          lv2ls
          for uri in $(lv2ls | grep '^urn:vialfx:'); do ./lv2_host_test "$uri"; done

      - name: Collect bundle
        run: |
          mkdir -p VialFX-Bundle/VST3 VialFX-Bundle/CLAP VialFX-Bundle/LV2
          cp -r build/plugins/*_artefacts/Release/VST3/*.vst3 VialFX-Bundle/VST3/
          cp build/plugins/*_artefacts/Release/CLAP/*.clap VialFX-Bundle/CLAP/
          cp -r build/plugins/*_artefacts/Release/LV2/*.lv2 VialFX-Bundle/LV2/
          cp LICENSE VialFX-Bundle/
          tar czf VialFX-Bundle-${{ env.VERSION }}-linux.tar.gz VialFX-Bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: VialFX-Bundle-${{ env.VERSION }}-linux.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVITALFX_BUILD_TESTS=OFF

      - name: Build all plugins
        run: cmake --build build

      - name: Collect bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force VialFX-Bundle/VST3, VialFX-Bundle/CLAP, VialFX-Bundle/LV2 | Out-Null
          Get-ChildItem build/plugins/*_artefacts/Release/VST3/*.vst3 | Copy-Item -Destination VialFX-Bundle/VST3 -Recurse
          Get-ChildItem build/plugins/*_artefacts/Release/CLAP/*.clap | Copy-Item -Destination VialFX-Bundle/CLAP
          Get-ChildItem build/plugins/*_artefacts/Release/LV2/*.lv2 | Copy-Item -Destination VialFX-Bundle/LV2 -Recurse
          $n = (Get-ChildItem VialFX-Bundle/LV2/*.lv2/*.ttl).Count
          if ($n -lt 48) { Write-Error "LV2 bundles incomplete ($n ttl files)"; exit 1 }
          Copy-Item LICENSE VialFX-Bundle/
          Compress-Archive -Path VialFX-Bundle -DestinationPath VialFX-Bundle-${{ env.VERSION }}-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-zip
          path: VialFX-Bundle-${{ env.VERSION }}-windows.zip

  macos:
    runs-on: macos-15
    env:
      # JUCE 6.0.5 still calls CGWindowListCreateImage, which the macOS 15 SDK marks unavailable when
      # the deployment target is 15+. Pin the target (also used by the juceaide helper build).
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (universal x86_64 + arm64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVITALFX_BUILD_TESTS=OFF

      - name: Build all plugins
        run: cmake --build build

      - name: LV2 check (lilv host, discovery and audio)
        run: |
          brew install lilv lv2
          g++ -std=c++17 tests/lv2_host_test.cpp $(pkg-config --cflags --libs lilv-0) -o lv2_host_test
          export LV2_PATH=$(mktemp -d)
          cp -R build/plugins/*_artefacts/Release/LV2/*.lv2 "$LV2_PATH"/
          for uri in $(ls build/plugins | sed -n 's/^\(.*\)_artefacts$/urn:vialfx:\1/p'); do ./lv2_host_test "$uri"; done

      - name: Ad-hoc sign and collect bundle
        run: |
          mkdir -p VialFX-Bundle/VST3 VialFX-Bundle/CLAP VialFX-Bundle/AU VialFX-Bundle/LV2
          cp -R build/plugins/*_artefacts/Release/VST3/*.vst3 VialFX-Bundle/VST3/
          cp -R build/plugins/*_artefacts/Release/CLAP/*.clap VialFX-Bundle/CLAP/
          cp -R build/plugins/*_artefacts/Release/AU/*.component VialFX-Bundle/AU/
          cp -R build/plugins/*_artefacts/Release/LV2/*.lv2 VialFX-Bundle/LV2/
          test "$(ls VialFX-Bundle/LV2/*.lv2/*.ttl | wc -l)" -ge 48
          for d in VialFX-Bundle/LV2/*.lv2; do codesign --force -s - "$d"/*.dylib; done
          for p in VialFX-Bundle/VST3/*.vst3 VialFX-Bundle/CLAP/*.clap VialFX-Bundle/AU/*.component; do codesign --force --deep -s - "$p"; done
          cp LICENSE VialFX-Bundle/
          ditto -c -k --keepParent VialFX-Bundle VialFX-Bundle-${{ env.VERSION }}-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-zip
          path: VialFX-Bundle-${{ env.VERSION }}-macos.zip

  # GitHub always wraps workflow artifacts in a .zip. To hand users the real files (tar.gz and zip)
  # without that extra layer, every push to main refreshes a "nightly" pre-release with the files as assets.
  release:
    needs: [linux, windows, macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish nightly release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" \
            --title "VialFX-Bundle ${{ env.VERSION }} - latest build (main)" \
            --notes "Automated build of commit $GITHUB_SHA. Portable archives (install with VialLauncher or copy by hand): VialFX-Bundle-${{ env.VERSION }}-linux.tar.gz, VialFX-Bundle-${{ env.VERSION }}-windows.zip, VialFX-Bundle-${{ env.VERSION }}-macos.zip. Unsigned test build; see the latest stable release for the supported version."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          tag="${GITHUB_REF_NAME}"
          gh release delete "$tag" --yes || true
          gh release create "$tag" dist/* --verify-tag --latest \
            --title "VialFX-Bundle ${{ env.VERSION }}" \
            --notes-file RELEASE_NOTES.md
