name: Build VialFX-Bundle

# Current scope: VST3 and CLAP on Linux, Windows and macOS.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build xvfb \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfreetype-dev libfontconfig1-dev libasound2-dev libgl1-mesa-dev \
            libglu1-mesa-dev libcurl4-openssl-dev libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build all nine plugins
        run: cmake --build build

      - name: Load every plugin in a test host
        run: |
          for p in build/plugins/*_artefacts/Release/VST3/*.vst3; do
            echo "=== $p"
            xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              build/vialfx_host_test_artefacts/Release/vialfx_host_test "$p"
          done

      - name: Collect bundle
        run: |
          mkdir -p VialFX-Bundle/VST3 VialFX-Bundle/CLAP
          cp -r build/plugins/*_artefacts/Release/VST3/*.vst3 VialFX-Bundle/VST3/
          cp build/plugins/*_artefacts/Release/CLAP/*.clap VialFX-Bundle/CLAP/
          cp LICENSE VialFX-Bundle/
          tar czf VialFX-Bundle-linux.tar.gz VialFX-Bundle

      - uses: actions/upload-artifact@v4
        with:
          name: VialFX-Bundle-linux
          path: VialFX-Bundle-linux.tar.gz

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVITALFX_BUILD_TESTS=OFF

      - name: Build all nine plugins
        run: cmake --build build

      - name: Collect bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force VialFX-Bundle/VST3, VialFX-Bundle/CLAP | Out-Null
          Get-ChildItem build/plugins/*_artefacts/Release/VST3/*.vst3 | Copy-Item -Destination VialFX-Bundle/VST3 -Recurse
          Get-ChildItem build/plugins/*_artefacts/Release/CLAP/*.clap | Copy-Item -Destination VialFX-Bundle/CLAP
          Copy-Item LICENSE VialFX-Bundle/
          Compress-Archive -Path VialFX-Bundle -DestinationPath VialFX-Bundle-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VialFX-Bundle-windows
          path: VialFX-Bundle-windows.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (universal x86_64 + arm64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVITALFX_BUILD_TESTS=OFF

      - name: Build all nine plugins
        run: cmake --build build

      - name: Ad-hoc sign and collect bundle
        run: |
          mkdir -p VialFX-Bundle/VST3 VialFX-Bundle/CLAP
          cp -R build/plugins/*_artefacts/Release/VST3/*.vst3 VialFX-Bundle/VST3/
          cp -R build/plugins/*_artefacts/Release/CLAP/*.clap VialFX-Bundle/CLAP/
          for p in VialFX-Bundle/VST3/*.vst3 VialFX-Bundle/CLAP/*.clap; do codesign --force --deep -s - "$p"; done
          cp LICENSE VialFX-Bundle/
          ditto -c -k --keepParent VialFX-Bundle VialFX-Bundle-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VialFX-Bundle-macos
          path: VialFX-Bundle-macos.zip
