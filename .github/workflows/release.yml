name: Publish release

# Publishes a version release (and its tag) from the artifacts of an already finished, successful
# "Build VialFX-Bundle" run, so the files are exactly the ones that were built and tested. Run it from the Actions
# tab with the run id and the tag (for example v1.0). The release text is RELEASE_NOTES.md.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id of a successful 'Build VialFX-Bundle' run"
        type: string
        required: true
      tag:
        description: "Release tag"
        type: string
        default: v1.0

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh run download "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'dist-*' --dir dist-raw
          find dist-raw -type f -exec mv {} dist/ \;
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run view "${{ inputs.run_id }}" --repo "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          gh release delete "${{ inputs.tag }}" --yes --cleanup-tag || true
          gh release create "${{ inputs.tag }}" dist/* --target "$sha" --latest \
            --title "VialFX-Bundle 1.0" \
            --notes-file RELEASE_NOTES.md
